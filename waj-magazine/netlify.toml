[build]
  command = "node scripts/build-issues.mjs && node scripts/build-blog.mjs"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/paid-placement"
  to = "/pages/paid-placement.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/pages/shop.html"
  status = 200

[[redirects]]
  from = "/issues"
  to = "/pages/issues.html"
  status = 200

[[redirects]]
  from = "/features"
  to = "/pages/features.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/pages/blog.html"
  status = 200

[[redirects]]
  from = "/advertise"
  to = "/pages/advertise.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/pages/contact.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/pages/events.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/pages/about.html"
  status = 200

[[redirects]]
  from = "/press"
  to = "/pages/press.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/pages/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/pages/privacy.html"
  status = 200

[[redirects]]
  from = "/post"
  to = "/pages/post.html"
  status = 200

[[redirects]]
  from = "/submit-post"
  to = "/pages/submit-post.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/pages/admin.html"
  status = 200

[[redirects]]
  from = "/order-success"
  to = "/pages/order-success.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/apparel"
  to = "https://we-are-jersey-shop.fourthwall.com"
  status = 302
  force = true

# Old duplicate copy of the site: send visitors and search engines to the real pages
[[redirects]]
  from = "/waj-magazine/*"
  to = "/:splat"
  status = 301
  force = true

# Article pages are generated at build time (scripts/build-blog.mjs).
# Posts that go live between builds fall back to the dynamic article page.
[[redirects]]
  from = "/blog/"
  to = "/pages/blog.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/pages/post.html"
  status = 200

# Old/common link: /advertising -> Advertise page
[[redirects]]
  from = "/advertising"
  to = "/advertise"
  status = 301
  force = true

  status = 200

[[redirects]]
  from = "/events"
  to = "/pages/events.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/pages/about.html"
  status = 200

[[redirects]]
  from = "/press"
  to = "/pages/press.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/pages/terms.html"

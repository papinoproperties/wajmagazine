<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Admin — WAJ Magazine</title>
  <link rel="icon" href="/assets/images/waj-red-logo.png" type="image/png"/>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{--crimson:#7A0000;--text:#1A1A1A;--muted:#555;--light:#888;--bg:#F6F6F6;--border:#E0E0E0;--white:#fff;--fd:'Bebas Neue',sans-serif;--fb:'Montserrat',sans-serif;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh;}
    a{color:var(--crimson);text-decoration:none;}

    /* ── LOGIN GATE ── */
    #loginGate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0A0A0A;}
    #loginGate .box{text-align:center;padding:48px;}
    #loginGate img{height:60px;margin-bottom:24px;}
    #loginGate h1{font-family:var(--fd);font-size:32px;color:#fff;letter-spacing:.04em;margin-bottom:10px;}
    #loginGate p{font-size:13px;color:#888;margin-bottom:28px;}
    #loginGate button{padding:14px 36px;background:var(--crimson);color:#fff;border:none;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;}

    /* ── SHELL ── */
    #dashboard{display:none;}
    header{background:#0A0A0A;border-bottom:3px solid var(--crimson);padding:14px 28px;display:flex;justify-content:space-between;align-items:center;}
    header .left{display:flex;align-items:center;gap:14px;}
    header img{height:34px;}
    header h1{font-family:var(--fd);font-size:20px;color:#fff;letter-spacing:.06em;}
    header .right{display:flex;align-items:center;gap:14px;}
    header .ue{font-size:11px;color:#888;}
    header .lo{background:none;border:1px solid #444;color:#aaa;padding:7px 16px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
    header .lo:hover{border-color:var(--crimson);color:var(--crimson);}

    /* ── TABS ── */
    .tabs{display:flex;gap:0;background:#fff;border-bottom:1px solid var(--border);padding:0 28px;overflow-x:auto;}
    .tab{padding:15px 20px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:all .15s;}
    .tab.active{color:var(--crimson);border-bottom-color:var(--crimson);}
    .cnt{display:inline-block;background:var(--crimson);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;margin-left:6px;}
    .cnt.blue{background:#1565C0;}
    .cnt.orange{background:#E65100;}

    .panel{display:none;padding:28px;max-width:1100px;margin:0 auto;}
    .panel.active{display:block;}

    /* ── SUBMISSION CARDS ── */
    .sub-card{background:#fff;border:1px solid var(--border);padding:22px;margin-bottom:14px;}
    .sub-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:12px;}
    .sub-head h3{font-size:17px;font-weight:700;}
    .sub-meta{font-size:11px;color:#999;margin-top:3px;}
    .badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:3px;white-space:nowrap;}
    .badge.guest{background:#E8F0FE;color:#1565C0;}
    .badge.internal{background:#FCE8E8;color:var(--crimson);}
    .sf{margin-bottom:9px;}
    .sf label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#999;display:block;margin-bottom:2px;}
    .sf .val{font-size:13px;color:var(--text);line-height:1.6;}
    .sub-content{max-height:180px;overflow-y:auto;background:var(--bg);padding:12px;border:1px solid var(--border);font-size:13px;line-height:1.7;white-space:pre-wrap;}
    .sub-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center;}

    /* ── SCHEDULE PICKER IN APPROVAL ── */
    .approve-schedule{display:flex;align-items:center;gap:8px;background:#FFF8E1;border:1px solid #FFD54F;padding:10px 14px;border-radius:3px;}
    .approve-schedule label{font-size:11px;font-weight:700;color:#5D4037;}
    .approve-schedule input[type=datetime-local]{padding:7px 10px;border:1px solid #FFD54F;font-size:12px;font-family:var(--fb);background:#fff;}

    /* ── BUTTONS ── */
    .btn{padding:9px 18px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
    .btn-green{background:#2E7D32;color:#fff;}
    .btn-green:hover{background:#1B5E20;}
    .btn-blue{background:#1565C0;color:#fff;}
    .btn-blue:hover{background:#0D47A1;}
    .btn-red{background:#fff;color:#888;border:1px solid var(--border);}
    .btn-red:hover{border-color:#cc0000;color:#cc0000;}
    .btn-outline{background:#fff;color:var(--muted);border:1px solid var(--border);}
    .btn-outline:hover{border-color:var(--crimson);color:var(--crimson);}
    .btn:disabled{background:#999!important;cursor:not-allowed;}

    /* ── EDITOR ── */
    .eg{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
    .field{margin-bottom:16px;}
    .field label{display:block;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#888;margin-bottom:6px;}
    .field input,.field select,.field textarea{width:100%;background:#fff;border:1px solid var(--border);color:var(--text);font-family:var(--fb);font-size:14px;padding:11px 13px;outline:none;transition:border-color .2s;}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--crimson);}
    .field textarea{resize:vertical;line-height:1.7;}
    .field .hint{font-size:10px;color:#999;margin-top:4px;}

    /* ── SCHEDULE UI in editor ── */
    .publish-mode{background:#fff;border:1px solid var(--border);padding:18px;margin-bottom:18px;}
    .publish-mode h4{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#888;margin-bottom:14px;}
    .radio-row{display:flex;gap:20px;margin-bottom:14px;}
    .radio-row label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;}
    .radio-row input[type=radio]{accent-color:var(--crimson);width:16px;height:16px;}
    #schedulePicker{display:none;}
    #schedulePicker .sd-row{display:flex;align-items:center;gap:12px;}
    #schedulePicker input[type=datetime-local]{padding:10px 13px;border:1px solid var(--border);font-size:13px;font-family:var(--fb);}
    .pub-btn-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
    .btn-publish{padding:14px 40px;background:var(--crimson);color:#fff;font-family:var(--fd);font-size:20px;letter-spacing:.08em;border:none;cursor:pointer;}
    .btn-publish:hover{background:#9B0000;}
    .btn-publish:disabled{background:#999;cursor:not-allowed;}

    /* ── POST ROWS ── */
    .post-row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);padding:14px 18px;margin-bottom:9px;}
    .post-row img{width:56px;height:56px;object-fit:cover;flex-shrink:0;}
    .post-row .info{flex:1;min-width:0;}
    .post-row h4{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .post-row .pmeta{font-size:11px;color:#999;margin-top:2px;}
    .post-row .acts{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;}
    .post-row button,.post-row a{padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--border);background:#fff;cursor:pointer;text-decoration:none;color:var(--muted);}
    .post-row button:hover,.post-row a:hover{border-color:var(--crimson);color:var(--crimson);}
    .sched-badge{display:inline-block;background:#E65100;color:#fff;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:2px;margin-left:6px;}

    /* ── MISC ── */
    .empty{text-align:center;padding:56px 20px;color:#999;}
    .spin{display:inline-block;width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--crimson);border-radius:50%;animation:sp .8s linear infinite;}
    @keyframes sp{to{transform:rotate(360deg);}}
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(120px);background:#1A1A1A;border:2px solid var(--crimson);color:#fff;padding:13px 22px;font-size:13px;font-weight:600;z-index:999;transition:transform .3s;border-radius:4px;white-space:nowrap;}
    .toast.show{transform:translateX(-50%) translateY(0);}
    .toast.err{border-color:#cc0000;}

    @media(max-width:700px){
      .eg{grid-template-columns:1fr;}
      .panel{padding:18px;}
      header{padding:12px 16px;}
      header h1{display:none;}
      .tabs{padding:0 10px;}
      .sub-actions{flex-direction:column;align-items:stretch;}
      .approve-schedule{flex-direction:column;align-items:flex-start;}
      .pub-btn-row{flex-direction:column;}
      .btn-publish{width:100%;text-align:center;}
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginGate">
  <div class="box">
    <img src="/assets/images/waj-red-logo.png" alt="WAJ Magazine"/>
    <h1>Admin Dashboard</h1>
    <p>Log in with your invited Netlify Identity account to continue.</p>
    <button onclick="netlifyIdentity.open()">Log In</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <div class="left">
      <img src="/assets/images/waj-red-logo.png" alt="WAJ"/>
      <h1>WAJ Admin</h1>
    </div>
    <div class="right">
      <span class="ue" id="userEmail"></span>
      <button class="lo" onclick="netlifyIdentity.logout()">Log Out</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="guests" onclick="switchTab('guests')">
      Guest Submissions <span class="cnt blue" id="guestCount">0</span>
    </div>
    <div class="tab" data-tab="new" onclick="switchTab('new')">
      Write / Edit Post
    </div>
    <div class="tab" data-tab="scheduled" onclick="switchTab('scheduled')">
      Scheduled <span class="cnt orange" id="scheduledCount">0</span>
    </div>
    <div class="tab" data-tab="published" onclick="switchTab('published')">
      Published <span class="cnt" id="publishedCount">0</span>
    </div>
  </div>

  <!-- GUEST SUBMISSIONS -->
  <div class="panel active" id="panel-guests">
    <div id="guestList"><div style="text-align:center;padding:56px;"><div class="spin"></div></div></div>
  </div>

  <!-- WRITE / EDIT POST -->
  <div class="panel" id="panel-new">

    <div class="eg">
      <div class="field"><label>Title *</label><input type="text" id="editTitle" placeholder="Post headline"/></div>
      <div class="field"><label>Author</label><input type="text" id="editAuthor" value="WAJ Editorial" placeholder="WAJ Editorial"/></div>
    </div>

    <div class="eg">
      <div class="field"><label>Category</label>
        <select id="editCategory">
          <option>Beauty</option><option>Business</option><option selected>Community</option>
          <option>Culture</option><option>Fashion</option><option>Food</option>
          <option>Health</option><option>Music</option><option>Sports</option>
        </select>
      </div>
      <div class="field"><label>Cover Image</label>
        <input type="text" id="editImage" placeholder="/assets/images/Cover_2_.png" oninput="previewImg()"/>
        <div style="display:flex;align-items:center;gap:10px;margin-top:8px;">
          <button type="button" class="btn btn-outline" onclick="document.getElementById('imgInput').click()">📁 Upload Image</button>
          <input type="file" id="imgInput" accept="image/*" style="display:none;" onchange="uploadImg(this)"/>
          <span id="imgStatus" style="font-size:11px;color:#999;"></span>
        </div>
        <img id="imgPreview" style="display:none;max-width:180px;max-height:120px;object-fit:cover;border:1px solid var(--border);margin-top:8px;"/>
      </div>
    </div>

    <div class="field"><label>URL Slug (auto-generated from title if blank)</label>
      <input type="text" id="editSlug" placeholder="my-post-title"/>
    </div>

    <div class="field"><label>Short Summary (shown on blog cards)</label>
      <textarea id="editSummary" rows="2" placeholder="1–2 sentence summary displayed on the blog..."></textarea>
    </div>

    <div class="field"><label>Full Content *</label>
      <textarea id="editContent" rows="16" placeholder="Write the full article here. Separate paragraphs with a blank line.&#10;&#10;The blog renders each paragraph automatically."></textarea>
      <p class="hint" id="wordCountHint">0 words</p>
    </div>

    <div class="field">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" id="editFeatured" style="width:auto;"/> Feature this post at the top of the blog
      </label>
    </div>

    <!-- PUBLISH MODE -->
    <div class="publish-mode">
      <h4>Publishing</h4>
      <div class="radio-row">
        <label><input type="radio" name="pubMode" value="now" checked onchange="toggleSchedule(this)"/> Publish immediately</label>
        <label><input type="radio" name="pubMode" value="scheduled" onchange="toggleSchedule(this)"/> Schedule for later</label>
      </div>
      <div id="schedulePicker">
        <div class="sd-row">
          <label style="font-size:12px;font-weight:600;">Go live on:</label>
          <input type="datetime-local" id="scheduleDate" min=""/>
          <span style="font-size:11px;color:#888;">Your local time</span>
        </div>
      </div>
    </div>

    <input type="hidden" id="editOriginalSlug"/>
    <input type="hidden" id="editApprovingId"/>

    <div class="pub-btn-row">
      <button class="btn-publish" id="publishBtn" onclick="submitPost()">Publish Now</button>
      <button class="btn btn-outline" style="display:none;" id="cancelEditBtn" onclick="resetEditor()">Cancel Edit</button>
    </div>
  </div>

  <!-- SCHEDULED POSTS -->
  <div class="panel" id="panel-scheduled">
    <div id="scheduledList"><div style="text-align:center;padding:56px;"><div class="spin"></div></div></div>
  </div>

  <!-- PUBLISHED POSTS -->
  <div class="panel" id="panel-published">
    <div id="publishedList"><div style="text-align:center;padding:56px;"><div class="spin"></div></div></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span></div>

<script>
let allPosts = [], allSubmissions = [], authToken = null;

// ── IDENTITY ──
netlifyIdentity.on('init', u => { if (u) showDash(u); });
netlifyIdentity.on('login', u => { showDash(u); netlifyIdentity.close(); });
netlifyIdentity.on('logout', () => {
  document.getElementById('loginGate').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
});
netlifyIdentity.init();

async function showDash(user) {
  authToken = await user.jwt();
  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('userEmail').textContent = user.email;
  // Set min date for scheduler to now
  const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById('scheduleDate').min = now.toISOString().slice(0,16);
  loadSubmissions();
  loadPosts();
}

function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), isErr ? 6000 : 4000);
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
}

// ── CONTENT WORD COUNT ──
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('editContent').addEventListener('input', function() {
    const words = this.value.trim().split(/\s+/).filter(Boolean).length;
    document.getElementById('wordCountHint').textContent = words + ' words';
  });
});

// ── SCHEDULING TOGGLE ──
function toggleSchedule(radio) {
  const picker = document.getElementById('schedulePicker');
  const btn = document.getElementById('publishBtn');
  if (radio.value === 'scheduled') {
    picker.style.display = 'block';
    btn.textContent = 'Schedule Post';
  } else {
    picker.style.display = 'none';
    btn.textContent = document.getElementById('editOriginalSlug').value ? 'Save Changes' : 'Publish Now';
  }
}

// ── IMAGE UPLOAD ──
function previewImg() {
  const url = document.getElementById('editImage').value.trim();
  const p = document.getElementById('imgPreview');
  if (!url) { p.style.display = 'none'; return; }
  p.src = url; p.style.display = 'block';
  p.onerror = () => p.style.display = 'none';
}

function uploadImg(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 4.5 * 1024 * 1024) { showToast('Image must be under 4MB', true); input.value = ''; return; }
  const status = document.getElementById('imgStatus');
  status.textContent = 'Uploading…'; status.style.color = '#7A0000';
  const reader = new FileReader();
  reader.onload = async () => {
    const base64 = reader.result.split(',')[1];
    try {
      const res = await fetch('/.netlify/functions/upload-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
        body: JSON.stringify({ filename: file.name, contentBase64: base64 })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Upload failed');
      document.getElementById('editImage').value = data.url;
      previewImg();
      status.textContent = '✓ Uploaded'; status.style.color = '#2a7a2a';
    } catch(err) {
      status.textContent = '✗ Failed'; status.style.color = '#cc0000';
      showToast('Upload error: ' + err.message, true);
    }
  };
  reader.readAsDataURL(file);
}

// ── LOAD GUEST SUBMISSIONS ──
async function loadSubmissions() {
  try {
    const res = await fetch('/.netlify/functions/get-submissions', {
      headers: { 'Authorization': 'Bearer ' + authToken }
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    allSubmissions = data.submissions || [];
    renderSubmissions();
  } catch(err) {
    document.getElementById('guestList').innerHTML = `<div class="empty">Error loading submissions: ${err.message}</div>`;
  }
}

function renderSubmissions() {
  document.getElementById('guestCount').textContent = allSubmissions.length;
  const list = document.getElementById('guestList');
  if (!allSubmissions.length) {
    list.innerHTML = '<div class="empty">No guest submissions waiting for review.</div>'; return;
  }
  list.innerHTML = allSubmissions.map((s, i) => {
    const d = s.data;
    const name = ((d['first-name'] || d.name || '') + ' ' + (d['last-name'] || '')).trim() || 'Unknown';
    const title = d['post-title'] || d.title || '(no title)';
    const email = d.email || '';
    const cat = d.category || '';
    const summary = d.summary || '';
    const content = d.content || '';
    const img = d['cover-image'] || d.image || d.photo || '';
    const date = new Date(s.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    return `
      <div class="sub-card">
        <div class="sub-head">
          <div>
            <h3>${title}</h3>
            <p class="sub-meta">By ${name} · ${email} · Submitted ${date}</p>
          </div>
          <span class="badge guest">Guest Post</span>
        </div>
        ${img ? `<div class="sf"><label>Uploaded Image</label><img src="${img}" alt="cover" style="max-width:220px;max-height:160px;object-fit:cover;border:1px solid var(--border);display:block;margin-top:4px;" onerror="this.outerHTML='<p style=\\'color:#cc0000;font-size:12px;\\'>⚠ Image link broken</p>'"/></div>` : '<div class="sf"><label>Image</label><div class="val" style="color:#999;">None uploaded</div></div>'}
        ${cat ? `<div class="sf"><label>Category</label><div class="val">${cat}</div></div>` : ''}
        ${summary ? `<div class="sf"><label>Summary</label><div class="val">${summary}</div></div>` : ''}
        <div class="sf"><label>Content</label><div class="sub-content">${content || '(empty)'}</div></div>
        <div class="sub-actions">
          <button class="btn btn-green" onclick="approveNow(${i})">✓ Approve &amp; Publish Now</button>
          <button class="btn btn-blue" onclick="approveSchedule(${i})">📅 Approve &amp; Schedule</button>
          <button class="btn btn-red" onclick="reject('${s.id}')">✗ Reject</button>
        </div>
        <div id="scheduleRow-${i}" style="display:none;margin-top:10px;">
          <div class="approve-schedule">
            <label>Schedule for:</label>
            <input type="datetime-local" id="schedDt-${i}"/>
            <button class="btn btn-blue" onclick="confirmSchedule(${i}, '${s.id}')">Confirm Schedule</button>
            <button class="btn btn-outline" onclick="document.getElementById('scheduleRow-${i}').style.display='none'">Cancel</button>
          </div>
        </div>
      </div>`;
  }).join('');
}

function approveNow(i) {
  prefillEditor(i);
  document.querySelector('input[name=pubMode][value=now]').checked = true;
  document.getElementById('schedulePicker').style.display = 'none';
  document.getElementById('publishBtn').textContent = 'Publish Now';
  switchTab('new');
  window.scrollTo({top:0,behavior:'smooth'});
  showToast('Submission loaded — review and click Publish Now');
}

function approveSchedule(i) {
  const row = document.getElementById('scheduleRow-' + i);
  row.style.display = row.style.display === 'none' ? 'block' : 'none';
  const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById('schedDt-' + i).min = now.toISOString().slice(0,16);
}

function confirmSchedule(i, submissionId) {
  const dt = document.getElementById('schedDt-' + i).value;
  if (!dt) { showToast('Please pick a date and time', true); return; }
  prefillEditor(i, submissionId, dt);
  document.querySelector('input[name=pubMode][value=scheduled]').checked = true;
  document.getElementById('schedulePicker').style.display = 'block';
  document.getElementById('scheduleDate').value = dt;
  document.getElementById('publishBtn').textContent = 'Schedule Post';
  switchTab('new');
  window.scrollTo({top:0,behavior:'smooth'});
  showToast('Submission loaded — review and click Schedule Post');
}

function prefillEditor(i, submissionId, scheduledDate) {
  const d = allSubmissions[i].data;
  const sid = submissionId || allSubmissions[i].id;
  document.getElementById('editTitle').value = d['post-title'] || d.title || '';
  document.getElementById('editAuthor').value = ((d['first-name'] || d.name || '') + ' ' + (d['last-name'] || '')).trim() || 'WAJ Editorial';
  document.getElementById('editCategory').value = d.category || 'Community';
  document.getElementById('editSummary').value = d.summary || '';
  document.getElementById('editContent').value = d.content || '';
  document.getElementById('editImage').value = d['cover-image'] || d.image || d.photo || '/assets/images/Cover_2_.png';
  document.getElementById('editSlug').value = '';
  document.getElementById('editFeatured').checked = false;
  document.getElementById('editOriginalSlug').value = '';
  document.getElementById('editApprovingId').value = sid;
  document.getElementById('cancelEditBtn').style.display = 'none';
  previewImg();
  const words = (d.content || '').trim().split(/\s+/).filter(Boolean).length;
  document.getElementById('wordCountHint').textContent = words + ' words';
}

async function reject(id) {
  if (!confirm('Reject and delete this submission? This cannot be undone.')) return;
  try {
    const res = await fetch('/.netlify/functions/delete-submission', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
      body: JSON.stringify({ id })
    });
    if (!res.ok) throw new Error('Failed');
    showToast('Submission rejected and removed');
    loadSubmissions();
  } catch(err) { showToast('Error: ' + err.message, true); }
}

// ── PUBLISH / SCHEDULE POST ──
async function submitPost() {
  const title = document.getElementById('editTitle').value.trim();
  const content = document.getElementById('editContent').value.trim();
  if (!title || !content) { showToast('Title and content are required', true); return; }

  const mode = document.querySelector('input[name=pubMode]:checked').value;
  let publishDate = null;
  if (mode === 'scheduled') {
    publishDate = document.getElementById('scheduleDate').value;
    if (!publishDate) { showToast('Please pick a date and time to schedule', true); return; }
    if (new Date(publishDate) <= new Date()) { showToast('Scheduled date must be in the future', true); return; }
  }

  const originalSlug = document.getElementById('editOriginalSlug').value;
  const action = originalSlug ? 'update' : 'create';

  const post = {
    title,
    author: document.getElementById('editAuthor').value.trim() || 'WAJ Editorial',
    category: document.getElementById('editCategory').value,
    image: document.getElementById('editImage').value.trim() || '/assets/images/Cover_2_.png',
    summary: document.getElementById('editSummary').value.trim(),
    content,
    slug: document.getElementById('editSlug').value.trim(),
    featured: document.getElementById('editFeatured').checked,
    publishDate: publishDate,
  };

  const btn = document.getElementById('publishBtn');
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = mode === 'scheduled' ? 'Scheduling…' : 'Publishing…';

  try {
    const res = await fetch('/.netlify/functions/publish-post', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
      body: JSON.stringify({ action, post, originalSlug: originalSlug || undefined })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');

    // Delete the guest submission that was approved
    const approvingId = document.getElementById('editApprovingId').value;
    if (approvingId) {
      await fetch('/.netlify/functions/delete-submission', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
        body: JSON.stringify({ id: approvingId })
      });
    }

    const msg = mode === 'scheduled'
      ? `Post scheduled for ${new Date(publishDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'})}`
      : 'Post published! Live in ~60 seconds.';
    showToast(msg);
    resetEditor();
    loadSubmissions();
    loadPosts();
    switchTab(mode === 'scheduled' ? 'scheduled' : 'published');
  } catch(err) {
    showToast('Error: ' + err.message, true);
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}

function resetEditor() {
  document.getElementById('editTitle').value = '';
  document.getElementById('editAuthor').value = 'WAJ Editorial';
  document.getElementById('editCategory').value = 'Community';
  document.getElementById('editImage').value = '';
  document.getElementById('editSlug').value = '';
  document.getElementById('editSummary').value = '';
  document.getElementById('editContent').value = '';
  document.getElementById('editFeatured').checked = false;
  document.getElementById('editOriginalSlug').value = '';
  document.getElementById('editApprovingId').value = '';
  document.getElementById('wordCountHint').textContent = '0 words';
  document.getElementById('imgPreview').style.display = 'none';
  document.getElementById('imgStatus').textContent = '';
  document.getElementById('scheduleDate').value = '';
  document.querySelector('input[name=pubMode][value=now]').checked = true;
  document.getElementById('schedulePicker').style.display = 'none';
  document.getElementById('publishBtn').textContent = 'Publish Now';
  document.getElementById('cancelEditBtn').style.display = 'none';
}

// ── LOAD & RENDER POSTS ──
async function loadPosts() {
  try {
    const res = await fetch('/content/posts.json?t=' + Date.now());
    if (!res.ok) throw new Error(
      'posts.json not found (HTTP ' + res.status + '). ' +
      'Go to your GitHub repo → waj-magazine/content/ and upload posts.json'
    );
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch(e) { throw new Error('posts.json is not valid JSON. Check the file in GitHub.'); }
    allPosts = data.posts || [];
    renderScheduled();
    renderPublished();
  } catch(err) {
    const msg = `<div class="empty" style="max-width:500px;margin:0 auto;">
      <p style="font-size:14px;font-weight:600;margin-bottom:8px;">⚠ ${err.message}</p>
      <p style="font-size:12px;color:#aaa;">Once posts.json exists in your repo, refresh this page.</p>
    </div>`;
    document.getElementById('scheduledList').innerHTML = msg;
    document.getElementById('publishedList').innerHTML = msg;
  }
}

function renderScheduled() {
  const now = new Date();
  const scheduled = allPosts.filter(p => p.status === 'scheduled' || (p.publishDate && new Date(p.publishDate) > now));
  scheduled.sort((a,b) => new Date(a.publishDate||a.date) - new Date(b.publishDate||b.date));
  document.getElementById('scheduledCount').textContent = scheduled.length;
  const list = document.getElementById('scheduledList');
  if (!scheduled.length) { list.innerHTML = '<div class="empty">No scheduled posts. Write a post and choose "Schedule for later."</div>'; return; }
  list.innerHTML = scheduled.map(p => {
    const goLive = p.publishDate ? new Date(p.publishDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}) : p.date;
    return postRow(p, `<span class="sched-badge">Goes live ${goLive}</span>`, [
      `<button onclick='publishNowFromScheduled("${p.slug}")'>Publish Now</button>`,
      `<button onclick='editPost("${p.slug}")'>Edit</button>`,
      `<button onclick='deletePost("${p.slug}")'>Delete</button>`,
    ]);
  }).join('');
}

function renderPublished() {
  const now = new Date();
  const published = allPosts.filter(p => p.status === 'published' && (!p.publishDate || new Date(p.publishDate) <= now));
  document.getElementById('publishedCount').textContent = published.length;
  const list = document.getElementById('publishedList');
  if (!published.length) { list.innerHTML = '<div class="empty">No published posts yet.</div>'; return; }
  list.innerHTML = published.map(p => postRow(p, '', [
    `<button onclick='editPost("${p.slug}")'>Edit</button>`,
    `<button onclick='deletePost("${p.slug}")'>Delete</button>`,
    `<a href="/post?slug=${p.slug}" target="_blank">View →</a>`,
  ])).join('');
}

function postRow(p, extra, actions) {
  return `
    <div class="post-row">
      <img src="${p.image}" alt="${p.title}" onerror="this.style.display='none'"/>
      <div class="info">
        <h4>${p.featured ? '⭐ ' : ''}${p.title} ${extra}</h4>
        <p class="pmeta">${p.category} · ${p.date} · by ${p.author}</p>
      </div>
      <div class="acts">${actions.join('')}</div>
    </div>`;
}

function editPost(slug) {
  const p = allPosts.find(x => x.slug === slug);
  if (!p) return;
  document.getElementById('editTitle').value = p.title;
  document.getElementById('editAuthor').value = p.author;
  document.getElementById('editCategory').value = p.category;
  document.getElementById('editImage').value = p.image;
  document.getElementById('editSlug').value = p.slug;
  document.getElementById('editSummary').value = p.summary;
  document.getElementById('editContent').value = p.content;
  document.getElementById('editFeatured').checked = !!p.featured;
  document.getElementById('editOriginalSlug').value = p.slug;
  document.getElementById('editApprovingId').value = '';
  previewImg();
  const words = (p.content||'').trim().split(/\s+/).filter(Boolean).length;
  document.getElementById('wordCountHint').textContent = words + ' words';

  // Restore scheduled state if editing a scheduled post
  if (p.publishDate && new Date(p.publishDate) > new Date()) {
    document.querySelector('input[name=pubMode][value=scheduled]').checked = true;
    document.getElementById('schedulePicker').style.display = 'block';
    document.getElementById('scheduleDate').value = p.publishDate.slice(0,16);
    document.getElementById('publishBtn').textContent = 'Save Schedule';
  } else {
    document.querySelector('input[name=pubMode][value=now]').checked = true;
    document.getElementById('schedulePicker').style.display = 'none';
    document.getElementById('publishBtn').textContent = 'Save Changes';
  }

  document.getElementById('cancelEditBtn').style.display = 'inline-block';
  switchTab('new');
  window.scrollTo({top:0,behavior:'smooth'});
}

async function publishNowFromScheduled(slug) {
  const p = allPosts.find(x => x.slug === slug);
  if (!p) return;
  if (!confirm(`Publish "${p.title}" immediately?`)) return;
  try {
    const res = await fetch('/.netlify/functions/publish-post', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
      body: JSON.stringify({
        action: 'update',
        post: { ...p, publishDate: null },
        originalSlug: slug
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    showToast('Post published now — live in ~60 seconds');
    loadPosts();
    switchTab('published');
  } catch(err) { showToast('Error: ' + err.message, true); }
}

async function deletePost(slug) {
  if (!confirm('Permanently delete this post? This cannot be undone.')) return;
  try {
    const res = await fetch('/.netlify/functions/publish-post', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
      body: JSON.stringify({ action: 'delete', originalSlug: slug })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed');
    showToast('Post deleted');
    loadPosts();
  } catch(err) { showToast('Error: ' + err.message, true); }
}
</script>
